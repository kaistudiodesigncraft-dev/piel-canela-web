name: Validate application

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_DATA_SOURCE: fixtures
      NEXT_PUBLIC_RELEASE_STAGE: beta
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      VERCEL_ENV: preview
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate release configuration contract
        run: pnpm exec vitest run src/lib/config/release-environment.test.ts src/app/robots.test.ts src/components/layout/BetaNotice.test.tsx
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  validate-supabase-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_DATA_SOURCE: supabase
      NEXT_PUBLIC_RELEASE_STAGE: beta
      NEXT_PUBLIC_SITE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_URL: https://ci-contract.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_contract_placeholder
      VERCEL_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production environment without remote writes
        run: node scripts/check-release-environment.mjs

  validate-database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start isolated Supabase services
        run: pnpm supabase:start
      - name: Apply migrations to the isolated database
        run: pnpm supabase:reset
      - name: Lint the isolated database
        run: pnpm supabase:lint
      - name: Stop isolated Supabase services
        if: always()
        run: pnpm supabase:stop --no-backup
